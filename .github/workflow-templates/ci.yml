name: CareOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    name: TypeScript / Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build frontend
        run: bun run build

  python:
    name: Python analytics / database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate database contract
        run: python database/validate.py
      - name: Run analytics checks
        run: python -m backend.analytics.cli check
      - name: Run Python tests
        run: python -m unittest discover -s backend/analytics/tests -t .
